name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify foundation
    runs-on: ubuntu-latest
    env:
      CI: "true"
      POSTGRES_USER: kairo_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: kairo_ci
      DATABASE_URL: postgresql://kairo_ci:ci-only-password@127.0.0.1:5432/kairo_ci
      TEST_DATABASE_URL: postgresql://kairo_ci:ci-only-password@127.0.0.1:5432/kairo_ci
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: kairo_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kairo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairo_ci -d kairo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.11"
          enable-cache: true
          cache-dependency-glob: harness/kairo_harness/uv.lock

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --locked --project harness/kairo_harness

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Verify migration files
        run: pnpm --filter @kairo/control-plane db:check

      - name: Apply migrations
        run: pnpm --filter @kairo/control-plane db:migrate

      - name: Run repository verification
        run: pnpm run verify

      - name: Check working tree diff
        run: git diff --check
